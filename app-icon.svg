<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>signalk-voice-llm</title>

  <!-- Rounded tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- Speech bubble: the "voice" half. Tail points down-left, like a
       spoken reply coming from the boat. -->
  <path d="M136 118h240a44 44 0 0 1 44 44v148a44 44 0 0 1-44 44H236l-74 62a10 10 0 0 1-16-8v-54h-10a44 44 0 0 1-44-44V162a44 44 0 0 1 44-44z"
        fill="#ffffff" fill-opacity="0.96"/>

  <!-- Sound bars inside the bubble: a level meter reading as speech.
       Heights are deliberately asymmetric so it looks like live audio
       rather than a static equaliser glyph. -->
  <g fill="url(#bars)">
    <rect x="176" y="216" width="24" height="40" rx="12"/>
    <rect x="220" y="184" width="24" height="104" rx="12"/>
    <rect x="264" y="160" width="24" height="152" rx="12"/>
    <rect x="308" y="192" width="24" height="88" rx="12"/>
    <rect x="352" y="222" width="24" height="28" rx="12"/>
  </g>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B3D63"/>
      <stop offset="1" stop-color="#1B7FB5"/>
    </linearGradient>
    <linearGradient id="bars" x1="176" y1="312" x2="376" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B3D63"/>
      <stop offset="1" stop-color="#2196C9"/>
    </linearGradient>
  </defs>
</svg>
